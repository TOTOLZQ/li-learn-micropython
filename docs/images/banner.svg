    <text x="2" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#94a3b8">for Cardputer 1.1 · MicroPython · GPL-3.0</text>
    <text x="2" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1be6e1">&gt; Btn · Keyboard · Screen</text>
  </g>

  <g transform="translate(668,38)" opacity="0.45">
    <circle cx="0" cy="0" r="3" fill="#1be6e1"/>
    <circle cx="20" cy="14" r="2" fill="#1be6e1"/>
    <circle cx="-22" cy="28" r="2" fill="#1be6e1"/>
