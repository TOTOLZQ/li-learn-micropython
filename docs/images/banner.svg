<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="li-learn-micropython">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0050"/>
      <stop offset="0.16" stop-color="#ff6600"/>
      <stop offset="0.33" stop-color="#ffea00"/>
      <stop offset="0.50" stop-color="#33cc00"/>
      <stop offset="0.66" stop-color="#00e5ff"/>
      <stop offset="0.83" stop-color="#3366ff"/>
      <stop offset="1" stop-color="#6600cc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1be6e1"/>
      <stop offset="1" stop-color="#2b5b84"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="260" fill="url(#bg)" rx="18"/>
  <rect width="720" height="260" fill="url(#grid)" rx="18" opacity="0.5"/>

  <g transform="translate(40,52)">
    <rect x="0" y="0" width="176" height="132" rx="12" fill="#0f172a" stroke="#1be6e1" stroke-width="2"/>
    <rect x="10" y="10" width="156" height="74" rx="4" fill="url(#screen)"/>
    <text x="88" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#0b1120" text-anchor="middle">M5.begin()</text>
    <g>
      <rect x="10" y="98" width="26" height="22" rx="4" fill="#334155"/>
      <rect x="42" y="98" width="26" height="22" rx="4" fill="#334155"/>
      <rect x="74" y="98" width="26" height="22" rx="4" fill="#334155"/>
      <rect x="106" y="98" width="26" height="22" rx="4" fill="#334155"/>
      <rect x="138" y="98" width="26" height="22" rx="4" fill="#1be6e1"/>
    </g>
  </g>

  <g transform="translate(256,78)">
